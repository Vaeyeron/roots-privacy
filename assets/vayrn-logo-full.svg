<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <g id="word">
      <polygon points="0,0 24,0 45,62 66,0 90,0 56,100 34,100"/>
      <polygon transform="translate(78 0)" points="0,100 34,0 56,0 90,100 66,100 45,38 24,100"/>
      <polygon transform="translate(156 0)" points="0,0 24,0 45,40 66,0 90,0 56,58 56,100 34,100 34,58"/>
      <path transform="translate(262 0)" fill-rule="evenodd" d="M0,0 L60,0 L80,18 L80,46 L66,60 L80,100 L56,100 L44,64 L22,64 L22,100 L0,100 Z M22,20 L52,20 L58,26 L58,40 L52,44 L22,44 Z"/>
      <polygon transform="translate(364 0)" points="0,0 24,0 60,62 60,0 84,0 84,100 60,100 24,38 24,100 0,100"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="#14122B"/>

  <!-- Рамка-прицел -->
  <g transform="translate(600 290) scale(0.65) translate(-600 -270)">
  <g fill="none" stroke="#2A8F8A" stroke-width="7">
    <path d="M290,126 V90 H326"/>
    <path d="M874,90 H910 V126"/>
    <path d="M910,414 V450 H874"/>
    <path d="M326,450 H290 V414"/>
  </g>

  <!-- Монограмма VA: общая полосатая грань служит и правой стороной V, и левой ногой A -->
  <g transform="translate(-20 0)">
    <!-- V: левая грань -->
    <polygon points="360,130 430,130 580,410 510,410" fill="#3DE0C8"/>
    <!-- общая грань из трёх полос -->
    <g fill="#3DE0C8">
      <polygon points="660,130 676,130 561,344.7 553,329.7"/>
      <polygon points="687,130 703,130 574.5,369.9 566.5,354.9"/>
      <polygon points="714,130 730,130 588,395.1 580,380.1"/>
    </g>
    <!-- A: правая нога и перекладина -->
    <polygon points="660,130 730,130 880,410 810,410" fill="#F6F1E4"/>
    <polygon points="649,300 741,300 753,322 637,322" fill="#FF3D81"/>
    <!-- кристалл -->
    <polygon points="545,143 558,165 545,187 532,165" fill="#FF3D81"/>
  </g>
  </g>

  <!-- Название -->
  <g transform="translate(234 490) scale(1.7) skewX(-10)">
    <use xlink:href="#word" href="#word" fill="#FF3D81" transform="translate(5 5)"/>
    <use xlink:href="#word" href="#word" fill="#F6F1E4"/>
    <polygon transform="translate(78 0)" points="37,72 53,72 56,84 34,84" fill="#3DE0C8"/>
  </g>

  <text x="606" y="762" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" letter-spacing="10" fill="#3DE0C8">// GAME STUDIO</text>
</svg>
